name: CI
# Every push AND every pull_request — never PR-only (a work-branch push with no PR
# open must still run CI). A branch with an open PR runs twice (branch + merge
# preview); accepted — engineer time >> CI minutes.
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Pinned dev deps installed verbatim — the analogue of --frozen-lockfile.
      - run: python -m pip install -r requirements-dev.txt
      - run: ./scripts/verify.sh
